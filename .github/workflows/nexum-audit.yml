name: NEXUM audit

on:
  push:
    branches:
      - fix/home-ux-20261105
      - audit/nexum-final-20261106
  workflow_dispatch:

concurrency:
  group: nexum-audit-final-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle permissions
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Package audited source snapshot
        if: always()
        run: git archive --format=zip --output=NEXUM_AUDIT_SOURCE.zip HEAD

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUM_AUDIT_SOURCE
          path: NEXUM_AUDIT_SOURCE.zip
          retention-days: 14
