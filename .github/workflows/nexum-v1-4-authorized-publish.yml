# Single-use authorized NEXUM 1.4 release dispatcher.
# It handles no credentials and publishes no artifacts by itself.
name: NEXUM - one-time authorized v1.4 publication

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-official-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release(v1.4): authorized signed publication')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify version and ensure the release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Eq '^[[:space:]]*versionCode = 9[[:space:]]*$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "1.4"[[:space:]]*$' app/build.gradle.kts
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v1.3"
          if gh release view "v1.4" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.4 is already published. Refusing duplicate publication."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.4" >/dev/null 2>&1; then
            echo "v1.4 tag exists. Refusing to reuse it."
            exit 1
          fi

      - name: Dispatch official signed release on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nexum-official-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true
          echo "Requested signed NEXUM v1.4 publication."
