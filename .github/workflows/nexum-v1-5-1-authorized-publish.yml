# One-time NEXUM v1.5.1 corrective release trigger authorized within the app testing workflow.
# Signing material remains exclusively in the official release workflow secrets.
name: NEXUM - one-time authorized v1.5.1 publication

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-official-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release(v1.5.1): approved corrective update')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure version matches and v1.5.1 does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Eq '^[[:space:]]*versionCode = 11[[:space:]]*$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "1.5.1"[[:space:]]*$' app/build.gradle.kts
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v1.5"
          if gh release view v1.5.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published v1.5.1; refusing duplicate."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.5.1" >/dev/null 2>&1; then
            echo "Tag v1.5.1 exists; refusing overwrite."
            exit 1
          fi

      - name: Publish with official signing and verification workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nexum-official-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true
          echo "Requested official NEXUM v1.5.1 release."
