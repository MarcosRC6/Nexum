# Single-use publication dispatcher. Remove after v1.3 is published.
# It never handles signing secrets, APK bytes, or private keys itself.
# Only the protected-main authorized release merge may dispatch publishing.
name: NEXUM - one-time authorized v1.3 publication

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: write
  actions: write

jobs:
  dispatch-official-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release(v1.3): authorized signed publication')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact protected main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify expected version and absence of existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Eq '^[[:space:]]*versionCode = 8[[:space:]]*$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "1.3"[[:space:]]*$' app/build.gradle.kts
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v1.2"
          if gh release view v1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.3 already exists; refusing duplicate publication."
            exit 1
          fi
          # A pre-release annotated tag was created on 2026-11-05 and
          # still points to the first project commit, not to a signed release.
          # Verify both immutable object IDs before modifying its ref.
          STALE_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3" --jq .object.sha)"
          test "$STALE_TAG_SHA" = "25a988a15861a1fb9d9b366ae2e5cd184facca43"
          STALE_TARGET="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$STALE_TAG_SHA" --jq .object.sha)"
          test "$STALE_TARGET" = "54de7eedd424c75d65b71b77646797cb514122ef"

      - name: Preserve historical v1.3 placeholder tag, then free release name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LEGACY_REF="refs/tags/legacy-v1.3-initial-20261105"
          OLD_TAG_OBJECT="25a988a15861a1fb9d9b366ae2e5cd184facca43"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/legacy-v1.3-initial-20261105" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/legacy-v1.3-initial-20261105" --jq .object.sha)" = "$OLD_TAG_OBJECT"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="$LEGACY_REF" \
              -f sha="$OLD_TAG_OBJECT" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3" --jq .object.sha)" = "$OLD_TAG_OBJECT"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.3"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3" >/dev/null 2>&1; then
            echo "Could not safely release the stale v1.3 tag."
            exit 1
          fi
          echo "Archived the original historical tag; v1.3 now available for official publication."

      - name: Request existing official signing and release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # workflow_dispatch events made with GITHUB_TOKEN can start workflows.
          # Publication and APK signature verification are owned entirely by
          # nexum-official-release.yml, not by this one-time dispatcher.
          gh workflow run nexum-official-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true
          echo "Requested official signed NEXUM v1.3 GitHub Release."
