# Single-use publication dispatcher. Remove after v1.3 is published.
# It never handles signing secrets, APK bytes, or private keys itself.
# Only the protected-main authorized release merge may dispatch publishing.
name: NEXUM - one-time authorized v1.3 publication

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-official-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release(v1.3): authorized signed publication')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact protected main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify expected version and absence of existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Eq '^[[:space:]]*versionCode = 8[[:space:]]*$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "1.3"[[:space:]]*$' app/build.gradle.kts
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v1.2"
          if gh release view v1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.3 already exists; refusing duplicate publication."
            exit 1
          fi
          if git ls-remote --tags origin refs/tags/v1.3 | grep -q .; then
            echo "Tag v1.3 already exists; refusing tag reuse."
            exit 1
          fi

      - name: Request existing official signing and release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # workflow_dispatch events made with GITHUB_TOKEN can start workflows.
          # Publication and APK signature verification are owned entirely by
          # nexum-official-release.yml, not by this one-time dispatcher.
          gh workflow run nexum-official-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true
          echo "Requested official signed NEXUM v1.3 GitHub Release."
