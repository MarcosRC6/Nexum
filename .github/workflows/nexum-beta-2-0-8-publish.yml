# One-time signed NEXUM 2.0 Beta 8, explicitly authorized by the owner on 2026-11-21.
# Runs ONLY when this workflow is added atop the pinned, already-reviewed beta3 code.
name: NEXUM - signed 2.0 Beta 7 prerelease

on:
  push:
    branches:
      - release/nexum-v2.0-beta.8-20261121
    paths:
      - '.github/workflows/nexum-beta-2-0-8-publish.yml'

permissions:
  contents: read

concurrency:
  group: nexum-signed-beta-2-0-8
  cancel-in-progress: false

jobs:
  signed-prerelease:
    if: github.ref == 'refs/heads/release/nexum-v2.0-beta.8-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact authorized beta source
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Enforce reviewed source and one-time version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dbd5d41e7773265960539f43fc8549d42123d0e7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/nexum-beta-2-0-8-publish.yml"
          test "$(git rev-parse HEAD^^)" = "eb746935081d587aaa10e1224951bb0cdaa83305"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "app/build.gradle.kts"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Eq '^[[:space:]]*versionCode = 22[[:space:]]*$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "2.0-beta.8"[[:space:]]*$' app/build.gradle.kts
          grep -Fq 'applicationId = "com.example.estudario"' app/build.gradle.kts
          if gh release view v2.0-beta.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Beta release already exists; refusing to overwrite"; exit 1
          fi
          if git ls-remote --tags origin refs/tags/v2.0-beta.8 | grep -q .; then
            echo "Beta tag already exists; refusing to overwrite"; exit 1
          fi

      - name: Require exact feature and version CI plus independent security audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44918517534" --jq '.head_sha + " " + .conclusion')" = "eb746935081d587aaa10e1224951bb0cdaa83305 success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44918517551" --jq '.head_sha + " " + .conclusion')" = "eb746935081d587aaa10e1224951bb0cdaa83305 success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44918795729" --jq '.head_sha + " " + .conclusion')" = "dbd5d41e7773265960539f43fc8549d42123d0e7 success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44918795777" --jq '.head_sha + " " + .conclusion')" = "dbd5d41e7773265960539f43fc8549d42123d0e7 success"
          echo "Exact source/version Android CI and independent security: PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Load official signing key privately
        env:
          SIGNING_BASE64: ${{ secrets.NEXUM_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASS: ${{ secrets.NEXUM_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.NEXUM_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.NEXUM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BASE64"
          test -n "$SIGNING_STORE_PASS"
          test -n "$SIGNING_ALIAS"
          test -n "$SIGNING_KEY_PASS"
          umask 077
          printf '%s' "$SIGNING_BASE64" | base64 --decode > "$RUNNER_TEMP/nexum-official.p12"
          test -s "$RUNNER_TEMP/nexum-official.p12"
          echo "NEXUM_SIGNING_STORE_FILE=$RUNNER_TEMP/nexum-official.p12" >> "$GITHUB_ENV"

      - name: Build, test and lint signed beta
        env:
          NEXUM_KEYSTORE_PASSWORD: ${{ secrets.NEXUM_KEYSTORE_PASSWORD }}
          NEXUM_KEY_ALIAS: ${{ secrets.NEXUM_KEY_ALIAS }}
          NEXUM_KEY_PASSWORD: ${{ secrets.NEXUM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon --stacktrace

      - name: Verify same official certificate, package and upgrade version
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/certificate.txt"
          grep -Fqi "2ba2c89de56e0fcfbc1a0b6df804800972d8bcd226b495b5d9628bcb4f2a2249" "$RUNNER_TEMP/certificate.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.example.estudario' versionCode='22' versionName='2.0-beta.8'"
          mkdir -p dist
          cp "$APK" "dist/NEXUM-v2.0-beta.8.apk"
          sha256sum "dist/NEXUM-v2.0-beta.8.apk" | tee dist/SHA256SUMS.txt

      - name: Archive verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUM_2_0_BETA_8_OFFICIAL_SIGNATURE
          path: |
            dist/NEXUM-v2.0-beta.8.apk
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub prerelease only after all checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/beta-notes.md" <<'NOTES'
          # NEXUM 2.0 Beta 8 · Prueba oficial firmada
          
          Candidata de pruebas sobre Beta 7. Se conserva la firma oficial y el paquete Android `com.example.estudario`. El esquema v7, la navegación, los IDs y los bancos personales no se modifican.
          
          ## Correcciones de esta beta
          
          - Editor Anki: al pulsar el selector morado «Ocultar partes de la imagen» se abre directamente el editor táctil a pantalla completa. El recuadro pequeño es únicamente una vista previa y desaparece el botón redundante «Editar a pantalla completa».
          - Ejercicios escritos numerados: el color de cada punto de la fotografía se obtiene de **la misma corrección usada para calcular la nota y las filas de respuestas**, incluyendo el tercer punto rojo con ✕ cuando se responde mal. Funciona también en revisión y práctica independiente.
          - Inicio y Ajustes > Accesos rápidos: nuevo interruptor «Enlaces» que permite mostrar un bloque compuesto exclusivamente por enlaces, aunque Biblioteca/Test/Plan/Estadísticas estén apagados. Si aún no hay enlaces, el bloque ofrece «Añadir mi primer enlace». La preferencia se conserva en el backup global.
          - Regresión: pruebas unitarias del caso 2/3 aciertos (5,83/10), respuesta omitida, visibilidad de enlaces sin otros accesos y dos importaciones de un mismo ZIP con acumulación y deduplicación por tema.
          
          ## Instrucciones de instalación segura
          
          **Antes de instalar, exporta una COPIA GLOBAL COMPLETA ZIP, verifica que sea legible y consérvala fuera del teléfono.**
          Instala encima de la versión oficial anterior, SIN desinstalar ni borrar datos. Beta 8 tiene `versionCode 22` (Beta 7: 21). No instales después una APK antigua con menor versionCode ni restaures destructivamente datos personales durante la prueba.
          
          ## Pruebas físicas necesarias
          
          Comprueba pulsar el selector morado desde una tarjeta nueva y otra antigua, hacer zoom y mover/redimensionar máscaras diminutas; fallar la respuesta escrita 3 y comprobar el 3 rojo en imagen y en revisión; desactivar los cuatro accesos clásicos y dejar activado solo «Enlaces», añadir un enlace y reiniciar la aplicación; importar dos veces un ZIP de prueba, revisar recuentos, imágenes, estadísticas, temas anteriores y Planario.
          
          Los flujos Android CI, unit tests, Lint y seguridad han pasado en SHA exactos; el publicador recompila y comprueba el certificado SHA-256 oficial. Esto NO demuestra que el gesto en un dispositivo físico funcione ni certifica restauraciones ante cortes de corriente. La restauración global multicomponente conserva un respaldo preventivo, pero no es una transacción ACID.
          
          `main` permanece en NEXUM 1.8; esta es una prerelease independiente.
          NOTES
          gh release create v2.0-beta.8             "dist/NEXUM-v2.0-beta.8.apk#NEXUM-v2.0-beta.8.apk"             "dist/SHA256SUMS.txt#SHA256SUMS.txt"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "NEXUM 2.0 Beta 8"             --prerelease             --notes-file "$RUNNER_TEMP/beta-notes.md"

      - name: Delete temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nexum-official.p12"
