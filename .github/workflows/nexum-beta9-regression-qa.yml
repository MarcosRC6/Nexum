name: NEXUM beta9 regression QA (no publication)

on:
  push:
    branches:
      - feature/beta8-pre2-integrity-ux-audit-20261121
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta9-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: JVM regression tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug Android build
        run: ./gradlew assembleDebug --stacktrace
      - name: Production compilation check (no signing/publication)
        run: ./gradlew assembleRelease --stacktrace
      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BETA9_REGRESSION_LINT
          path: app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore
