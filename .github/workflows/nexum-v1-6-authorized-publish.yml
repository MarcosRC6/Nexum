# NEXUM v1.6: one-time user-authorized release. No signing material here.
name: NEXUM - one-time authorized v1.6 publication

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-official-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release(v1.6): authorized signed publication')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout protected main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify version, predecessor and absence of duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Eq '^[[:space:]]*versionCode = 12[[:space:]]*$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "1.6"[[:space:]]*$' app/build.gradle.kts
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v1.5.1"
          if gh release view v1.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "NEXUM v1.6 already exists; refusing duplicate publication."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.6" >/dev/null 2>&1; then
            echo "NEXUM v1.6 tag exists; refusing to overwrite it."
            exit 1
          fi

      - name: Dispatch existing official signature verification and publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nexum-official-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true
          echo "Authorized signed NEXUM v1.6 publication requested."
