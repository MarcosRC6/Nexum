name: NEXUM 2.0 - Android instrumented recovery QA

on:
  push:
    branches:
      - fix/nexum-2-0-stable-data-safety-20261121
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexum-2-0-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test actual APK on Android API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2 pinned commit
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUM_2_0_ANDROID_INSTRUMENTED_REPORTS
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
