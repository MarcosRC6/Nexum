name: NEXUM Android relaunch smoke

on:
  push:
    branches:
      - feature/neon-ui-light-dark-20261106
  workflow_dispatch:

jobs:
  reopen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Gradle
        run: chmod +x gradlew
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            set -e
            ./gradlew assembleDebug assembleDebugAndroidTest connectedDebugAndroidTest -PnexumPreview=true --stacktrace
            adb logcat -c
            adb shell am start -W -n com.example.estudario.neon/com.example.testario.MainActivity
            sleep 5
            adb shell pidof com.example.estudario.neon
            adb shell am force-stop com.example.estudario.neon
            adb shell am start -W -n com.example.estudario.neon/com.example.testario.MainActivity
            sleep 5
            adb shell pidof com.example.estudario.neon
            adb shell input keyevent HOME
            adb shell am start -W -n com.example.estudario.neon/com.example.testario.MainActivity
            sleep 5
            adb shell pidof com.example.estudario.neon
            adb logcat -d -v brief -s AndroidRuntime:E > android-relaunch-runtime.log || true
            if grep -A 3 'FATAL EXCEPTION' android-relaunch-runtime.log | grep -q 'com.example.estudario.neon'; then
              echo 'NEXUM preview threw a fatal exception on relaunch'
              cat android-relaunch-runtime.log
              exit 1
            fi
      - name: Upload relaunch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUM_ANDROID_RELAUNCH_LOG
          path: |
            android-relaunch-runtime.log
            app/build/reports/androidTests/connected/
          retention-days: 14
          if-no-files-found: ignore
